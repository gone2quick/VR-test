<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Duel VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#ui{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));text-align:center;color:#ddd;font-size:14px;pointer-events:none;text-shadow:0 1px 3px #000}
#vr{pointer-events:auto;padding:12px 26px;font-size:16px;border:0;border-radius:8px;background:#c9a227;color:#111;font-weight:700;cursor:pointer;margin-bottom:8px}</style></head>
<body><div id="bars" style="position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;width:240px;color:#fff;font:bold 12px system-ui;pointer-events:none"></div><div id="ui"><button id="vr" style="display:none"></button><div id="hint"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color(0x151a22);scene.fog=new T.Fog(0x151a22,7,20);
const rig=new T.Group();scene.add(rig);
const camera=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,50);camera.position.set(0,1.6,0);rig.add(camera);
scene.add(new T.HemisphereLight(0xbcd0ff,0x333344,1));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(2,5,3);scene.add(sun);
const mat=(c,o={})=>new T.MeshStandardMaterial(Object.assign({color:c},o));
scene.add(new T.Mesh(new T.CircleGeometry(6,48).rotateX(-Math.PI/2),mat(0x3a3f4a)));
const ring=new T.Mesh(new T.RingGeometry(5.8,6,48).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0xc9a227}));ring.position.y=.01;scene.add(ring);
for(let i=0;i<10;i++){const a=i/10*Math.PI*2,p=new T.Mesh(new T.CylinderGeometry(.25,.3,4,12),mat(0x555b66));p.position.set(Math.sin(a)*7,2,Math.cos(a)*7);scene.add(p)}

// ---------- audio / haptics ----------
let ac;function snd(f,d,type='square',v=.12){try{ac=ac||new AudioContext();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f/2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function buzz(h,s,ms){const a=h.gp&&(h.gp.hapticActuators&&h.gp.hapticActuators[0]||h.gp.vibrationActuator);try{if(a){a.pulse?a.pulse(s,ms):a.playEffect&&a.playEffect('dual-rumble',{duration:ms,strongMagnitude:s,weakMagnitude:s})}}catch(e){}}

// ---------- player swords ----------
function makeSword(col){const g=new T.Group(),m=mat(col,{metalness:.8,roughness:.3});
 const b=new T.Mesh(new T.BoxGeometry(.05,.012,.85),m);b.position.z=-.58;g.add(b);
 const gd=new T.Mesh(new T.BoxGeometry(.22,.03,.04),mat(0x8a6d1a));gd.position.z=-.15;g.add(gd);
 g.add(new T.Mesh(new T.CylinderGeometry(.018,.018,.15).rotateX(Math.PI/2),mat(0x332211)));
 return g}
const hands=[0,1].map(i=>{const c=renderer.xr.getController(i);rig.add(c);
 const s=makeSword(0xc8d0da);s.rotation.x=.7;c.add(s);
 const h={c,s,prev:null,speed:0,cd:0,gp:null,hand:''};
 c.addEventListener('connected',e=>{h.gp=e.data.gamepad;h.hand=e.data.handedness});return h});
hands[1].s.visible=false;
renderer.xr.addEventListener('sessionstart',()=>{hands[1].s.visible=true;hint.textContent=''});
renderer.xr.addEventListener('sessionend',()=>{hands[1].s.visible=false;hands[0].c.rotation.set(0,0,0)});
const tmp=new T.Vector3();
function bladePts(s){s.updateWorldMatrix(true,false);const a=[];for(let i=0;i<6;i++)a.push(s.localToWorld(new T.Vector3(0,0,-.15-.17*i)));return a}

// ---------- vignette (damage flash) ----------
const vig=new T.Mesh(new T.SphereGeometry(.3,12,8),new T.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:0,side:T.BackSide,depthTest:false}));
vig.renderOrder=999;camera.add(vig);

// ---------- enemy ----------
const E=new T.Group();scene.add(E);
const bodyMat=mat(0x6b2d2d,{emissive:0x000000});
const part=(g,y,x=0)=>{const m=new T.Mesh(g,bodyMat);m.position.set(x,y,0);E.add(m);return m};
part(new T.CylinderGeometry(.26,.2,.75),1.1);part(new T.SphereGeometry(.17,16,12),1.62);
part(new T.CylinderGeometry(.09,.09,.8),.4,-.12);part(new T.CylinderGeometry(.09,.09,.8),.4,.12);
part(new T.BoxGeometry(.7,.12,.2),1.42);
const pivot=new T.Group();pivot.position.set(0,1,.15);pivot.rotation.order='YXZ';E.add(pivot);
const arms=[0,1,2,3].map(()=>{const m=new T.Mesh(new T.CylinderGeometry(.055,.045,1,8),bodyMat);E.add(m);return m});
const _d=new T.Vector3(),_u=new T.Vector3(0,1,0);
function limb(m,a,b){_d.subVectors(b,a);const l=_d.length()||.01;m.position.copy(a).addScaledVector(_d,.5);m.scale.y=l;m.quaternion.setFromUnitVectors(_u,_d.normalize())}
function poseArms(){pivot.updateMatrix();[[-1,-.12],[1,.02]].forEach((a,i)=>{const sd=a[0],sh=new T.Vector3(sd*.34,1.42,0),h=new T.Vector3(0,a[1],0).applyMatrix4(pivot.matrix),el=sh.clone().add(h).multiplyScalar(.5);el.x+=sd*.14;el.y-=.12;limb(arms[i*2],sh,el);limb(arms[i*2+1],el,h)})}
const eMat=mat(0xb0b8c4,{metalness:.8,roughness:.3,emissive:0x000000});
const eb=new T.Mesh(new T.BoxGeometry(.06,1.3,.015),eMat);eb.position.y=.8;pivot.add(eb);
const eg=new T.Mesh(new T.BoxGeometry(.24,.04,.05),mat(0x8a6d1a));eg.position.y=.12;pivot.add(eg);
function randSpot(s){const z=Math.random()*4|0;let x,y,zz;
 if(z===0){const a=(Math.random()-.5)*2.2;y=1.5+Math.random()*.25;x=Math.sin(a)*.17;zz=Math.cos(a)*.17+.02}
 else if(z<3){const a=(Math.random()-.5)*2.4;y=.8+Math.random()*.55;x=Math.sin(a)*.26;zz=Math.cos(a)*.24}
 else{const sd=Math.random()<.5?-1:1;y=.2+Math.random()*.6;x=sd*.12+(Math.random()-.5)*.08;zz=.1}
 s.position.set(x,y,zz);s.userData.head=z===0}
const spots=[0].map(()=>{const m=new T.Mesh(new T.SphereGeometry(.09,12,8),new T.MeshBasicMaterial({color:0xffe14d}));m.cool=0;m.life=5+Math.random()*3;randSpot(m);E.add(m);return m});
const IDLE={x:.5,y:0};
const ATKS=[{wind:{x:-.6,y:0},end:{x:1.7,y:0}},{wind:{x:1.57,y:1.3},end:{x:1.57,y:-1.3}},{wind:{x:1.57,y:-1.3},end:{x:1.57,y:1.3}}];
const lp=(a,b,k)=>({x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k});
const ez=k=>k*k*(3-2*k);
const en={hp:100,max:100,state:'idle',t:0,atk:ATKS[0],hit:false,level:1,dead:false,flash:0,pose:IDLE};
const pl={hp:100,hpMax:100,st:10,max:10};
let msg='FIGHT!',msgT=3;
function spawn(l){en.level=l;en.boss=l%5===0;en.max=(60+l*20)*(en.boss?2.2:1)*(1-bv('fh'));en.hp=en.max;en.dead=false;en.done=false;E.rotation.x=0;E.visible=true;E.scale.setScalar(en.boss?1.25:1);
 E.position.set(rig.position.x,0,rig.position.z-3.5);en.state='idle';en.t=-.8;
 spots.forEach(s=>{s.cool=0;randSpot(s)});bodyMat.color.setHSL((l*.09)%1,en.boss?.8:.5,en.boss?.2:.33);msg=(en.boss?'BOSS ':'ROUND ')+l;msgT=2.5}
function hurt(){pl.hp-=(12+en.level*2)*(en.boss?1.3:1)*(1-bv('arm'));vig.material.opacity=.6;hands.forEach(h=>buzz(h,1,150));snd(90,.25,'sawtooth',.25);
 if(pl.hp<=0){msg='YOU DIED';msgT=3;gameOver()}}
const segD=(p,a,b)=>{const ab=b.clone().sub(a),t=Math.max(0,Math.min(1,p.clone().sub(a).dot(ab)/(ab.lengthSq()||1)));return p.distanceTo(a.clone().add(ab.multiplyScalar(t)))};
const minD=(A,B)=>{let m=9;for(const a of A)for(const b of B)m=Math.min(m,a.distanceTo(b));return m};
function enemyPts(){E.updateMatrixWorld(true);const a=[];for(let i=0;i<10;i++)a.push(pivot.localToWorld(new T.Vector3(0,.15+.15*i,0)));return a}
function updateEnemy(dt,time){
 camera.getWorldPosition(tmp);const pp=tmp.clone();
 if(en.dead){E.rotation.x=Math.min(1.5,E.rotation.x+dt*2);en.t+=dt;if(en.t>1.5&&!en.done){en.done=true;roundEnd()}return}
 const dx=pp.x-E.position.x,dz=pp.z-E.position.z,dist=Math.hypot(dx,dz)||1;
 E.rotation.y=Math.atan2(dx,dz);en.t+=dt;en.flash=Math.max(0,en.flash-dt);
 bodyMat.emissive.setRGB(en.flash>0?.8:0,0,0);
 const windT=(Math.max(.3,.75-.04*en.level)+bv('wu'))*(en.boss?.85:1);
 let col=0;
 if(en.state==='idle'){
  const gap=dist-1.1,spd=Math.min(2.5,1+.1*en.level),step=Math.min(spd*dt,Math.abs(gap));
  if(en.t>0&&Math.abs(gap)>.1){E.position.x+=dx/dist*Math.sign(gap)*step;E.position.z+=dz/dist*Math.sign(gap)*step}
  const sw=Math.sin(time*.8)*.6*dt;E.position.x+=dz/dist*sw;E.position.z-=dx/dist*sw;
  en.pose=lp(IDLE,IDLE,0);en.pose={x:IDLE.x+Math.sin(time*3)*.05,y:0};
  if(en.t>Math.max(.4,1.2-.07*en.level)){en.atk=ATKS[Math.random()*ATKS.length|0];en.state='wind';en.t=0;en.hit=false;snd(300,.15,'triangle',.08)}
 }else if(en.state==='wind'){
  en.pose=lp(IDLE,en.atk.wind,ez(Math.min(1,en.t/windT)));col=1;
  if(en.t>=windT){en.state='strike';en.t=0;snd(500,.2,'sawtooth',.06)}
 }else if(en.state==='strike'){
  en.pose=lp(en.atk.wind,en.atk.end,ez(Math.min(1,en.t/.22)));col=1;
  const pts=enemyPts();
  if(!en.hit){
   let parried=false;
   for(const h of hands){if(!parried&&h.s.visible&&pl.st>=pcost()&&minD(pts,bladePts(h.s))<.16){parried=true;pl.st-=pcost();buzz(h,1,120)}}
   if(parried){en.state='stagger';en.t=-bv('bul');en.hit=true;snd(1400,.15,'square',.2);msg='PARRY!';msgT=.8}
   else{const bot=pp.clone();bot.y=Math.max(.3,pp.y-1);
    if(pts.some(p=>segD(p,bot,pp)<.32)){en.hit=true;hurt()}}
  }
  if(en.t>=.22){en.state='recover';en.t=0}
 }else if(en.state==='recover'){
  en.pose=lp(en.atk.end,IDLE,ez(Math.min(1,en.t/.6)));if(en.t>.7){en.state='idle';en.t=0}
 }else if(en.state==='stagger'){
  en.pose=lp(en.pose,{x:-.8,y:0},.2);if(en.t>(en.long?1.2:.9)){en.state='idle';en.t=0}
 }
 eMat.emissive.setRGB(col*.9,0,0);
 pivot.rotation.set(en.pose.x,en.pose.y,0);poseArms();
 const r=Math.hypot(E.position.x,E.position.z);if(r>5.5){E.position.x*=5.5/r;E.position.z*=5.5/r}
 E.updateMatrixWorld(true);
}
function playerAttacks(dt){
 for(const h of hands){
  if(!h.s.visible)continue;
  h.s.updateWorldMatrix(true,false);const tip=h.s.localToWorld(new T.Vector3(0,0,-1));
  if(h.prev){const raw=tip.distanceTo(h.prev)/dt;h.speed=h.speed*.5+raw*.5}h.prev=tip;h.cd-=dt;
  if(en.dead||h.cd>0||h.speed<1.6-bv('sp'))continue;
  for(const p of bladePts(h.s)){
   const dx=p.x-E.position.x,dz=p.z-E.position.z;
   const spot=spots.find(s=>s.cool<=0&&p.distanceTo(s.getWorldPosition(new T.Vector3()))<.17*(1+bv('sz')));const head=!!spot&&spot.userData.head;
   const torso=Math.hypot(dx,dz)<.38&&p.y>.5&&p.y<1.8;
   if(!spot&&torso&&h.cd<=0){h.cd=.25;snd(700,.06,'square',.1);buzz(h,.3,40);msg='HIT A WEAK SPOT';msgT=.6}
   if(spot){
    const ac=acost();if(pl.st<ac){h.cd=.35;msg='NO STAMINA';msgT=.6;snd(100,.1);break}pl.st-=ac;pl.hp=Math.min(pl.hpMax,pl.hp+bv('ls'));let d=Math.min(35,h.speed*5)*(head?1.5+bv('head'):1)*(en.state==='stagger'?1.5:1)*wp.dmg*(1+bv('dmg'))*(Math.random()<bv('lk')?2:1);
    spot.cool=Math.max(.4,1.5-bv('sc'));en.hp-=d;en.flash=.15;h.cd=.35;buzz(h,Math.min(1,h.speed/5),80);snd(head?220:160,.12,'square',.2);
    const l=Math.hypot(dx,dz)||1;E.position.x+=dx/l*.2;E.position.z+=dz/l*.2;
    if(en.state==='wind'){en.state='stagger';en.t=0;en.long=false}
    if(en.hp<=0){en.dead=true;en.t=0;msg='VICTORY';msgT=2;snd(600,.5,'triangle',.2)}
    break}
  }
 }
}

// ---------- HUD board ----------
const cv=document.createElement('canvas');cv.width=512;cv.height=256;const cx=cv.getContext('2d');
const tex=new T.CanvasTexture(cv);const board=new T.Mesh(new T.PlaneGeometry(2.4,1.2),new T.MeshBasicMaterial({map:tex,transparent:true}));
board.position.set(0,2.7,-5.6);scene.add(board);let last='';
function hud(){const k=[en.level,en.hp|0,pl.hp|0,msgT>0?msg:''].join();if(k===last)return;last=k;
 cx.clearRect(0,0,512,256);cx.fillStyle='rgba(10,12,18,.75)';cx.fillRect(0,0,512,256);
 cx.fillStyle='#c9a227';cx.font='bold 40px system-ui';cx.textAlign='center';cx.fillText((en.boss?'BOSS ':'ROUND ')+en.level,256,50);
 const bar=(y,v,c,l)=>{cx.fillStyle='#333';cx.fillRect(40,y,432,28);cx.fillStyle=c;cx.fillRect(40,y,432*Math.max(0,v),28);cx.fillStyle='#fff';cx.font='18px system-ui';cx.textAlign='left';cx.fillText(l,46,y+21)};
 bar(75,en.hp/en.max,'#c0392b','ENEMY');bar(120,pl.hp/pl.hpMax,'#27ae60','YOU');
 cx.fillStyle='#fff';cx.font='bold 44px system-ui';cx.textAlign='center';cx.fillText(msgT>0?msg:'',256,210);tex.needsUpdate=true}

// ---------- player bars (wrist panel in VR, corner overlay on desktop) ----------
const wc=document.createElement('canvas');wc.width=256;wc.height=128;const wx=wc.getContext('2d');const wtex=new T.CanvasTexture(wc);
const wrist=new T.Mesh(new T.PlaneGeometry(.16,.08),new T.MeshBasicMaterial({map:wtex,transparent:true}));
wrist.position.set(0,.05,.05);wrist.rotation.x=-1.2;hands[1].c.add(wrist);
const bars=document.getElementById('bars');let lastB='';
function updateBars(){const k=(pl.hp|0)+','+(pl.st*4|0);if(k===lastB)return;lastB=k;
 wx.clearRect(0,0,256,128);wx.fillStyle='rgba(10,12,18,.8)';wx.fillRect(0,0,256,128);
 [['HP',pl.hp/pl.hpMax,'#27ae60',pl.hp|0],['ST',pl.st/pl.max,'#f1c40f',Math.floor(pl.st)]].forEach((b,i)=>{const y=14+i*56;wx.fillStyle='#333';wx.fillRect(10,y,236,40);wx.fillStyle=b[2];wx.fillRect(10,y,236*Math.max(0,b[1]),40);wx.fillStyle='#000';wx.font='bold 26px system-ui';wx.fillText(b[0]+' '+b[3],18,y+30)});wtex.needsUpdate=true;
 bars.innerHTML='<div style="background:#333;margin-bottom:6px"><div style="background:#27ae60;width:'+Math.max(0,pl.hp/pl.hpMax*100)+'%;padding:3px 6px;white-space:nowrap">HP '+(pl.hp|0)+'</div></div><div style="background:#333"><div style="background:#f1c40f;color:#000;width:'+Math.max(0,pl.st/pl.max*100)+'%;padding:3px 6px;white-space:nowrap">STAMINA '+Math.floor(pl.st)+'/'+pl.max+'</div></div>'}

// ---------- progression: buffs, weapons, meta upgrades, menu ----------
const BUFFS=[['Vitality','+10 max HP','hp',10],['Regeneration','+0.4 HP per second','hpr',.4],['Endurance','+1 max stamina','st',1],['Second Wind','+0.08 stamina/sec','sr',.08],['Brute Force','+8% damage','dmg',.08],['Executioner','+10% head spot dmg','head',.1],['Iron Skin','-4% damage taken','arm',.04],['Bulwark','+0.12s parry stagger','bul',.12],['Light Strikes','-0.1 swing cost','ac',.1],['Steady Guard','-0.05 parry cost','pc',.05],['Vampiric','+0.4 HP per hit','ls',.4],['Triumph','+3 HP each round','kh',3],['Patient Mark','Weak spot stays +0.5s','sl',.5],['Wide Mark','+7% weak spot size','sz',.07],['Quick Mark','Spot returns 0.1s faster','sc',.1],['Slow Foes','Enemy windup +0.03s','wu',.03],['Frailty','-3% enemy HP','fh',.03],['Long Arm','+3% sword reach','rc',.03],['Lucky Strike','+5% double dmg chance','lk',.05],['Swift Edge','-0.06 swing speed needed','sp',.06]];
const lv={},per={};BUFFS.forEach(b=>{lv[b[2]]=0;per[b[2]]=b[3]});const bv=k=>lv[k]*per[k];
const pcost=()=>Math.max(.2,1-bv('pc')),acost=()=>Math.max(1,2-bv('ac'));
const WEAPONS=[{n:'SWORD',len:1,reg:1,dmg:1,d:['Balanced']},{n:'GREATSWORD',len:1.4,reg:.7,dmg:1.25,d:['Long reach, +25% dmg','Slower stamina gain']},{n:'DAGGER',len:.55,reg:1.7,dmg:.75,d:['Short reach, -25% dmg','Faster stamina gain']}];
let wp=WEAPONS[0],running=false,choosing=false,lastRound=0;
let meta={souls:0,hp:0,st:0};try{Object.assign(meta,JSON.parse(localStorage.getItem('duelvr')||'{}'))}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('duelvr',JSON.stringify(meta))}catch(e){}};
function recalc(){pl.hpMax=100+10*meta.hp+bv('hp');pl.max=10+meta.st+bv('st');pl.hp=Math.min(pl.hp,pl.hpMax);pl.st=Math.min(pl.st,pl.max);hands.forEach(h=>h.s.scale.z=wp.len*(1+bv('rc')))}
const cardGrp=new T.Group();scene.add(cardGrp);let cardCb=null,cardT=0;
function mkCard(it){const c=document.createElement('canvas');c.width=256;c.height=320;const x=c.getContext('2d');
 x.fillStyle='#c9a227';x.fillRect(0,0,256,320);x.fillStyle='#151a22';x.fillRect(8,8,240,304);x.textAlign='center';
 x.fillStyle='#ffd45a';x.font='bold 28px system-ui';x.fillText(it.t,128,60);x.fillStyle='#fff';x.font='19px system-ui';it.d.forEach((l,i)=>x.fillText(l,128,120+i*34));
 x.fillStyle='#888';x.font='16px system-ui';x.fillText('SLASH TO CHOOSE',128,290);
 const m=new T.Mesh(new T.PlaneGeometry(.5,.625),new T.MeshBasicMaterial({map:new T.CanvasTexture(c),side:T.DoubleSide}));m.userData.it=it;return m}
function openCards(items,cb){cardCb=cb;cardT=.7;choosing=true;
 const p=camera.getWorldPosition(new T.Vector3()),f=camera.getWorldDirection(new T.Vector3());f.y=0;f.normalize();const r=new T.Vector3(-f.z,0,f.x);
 items.forEach((it,i)=>{const m=mkCard(it),o=(i-(items.length-1)/2)*.62;m.position.set(p.x+f.x*1.1+r.x*o,Math.max(1.1,p.y-.15),p.z+f.z*1.1+r.z*o);m.lookAt(p.x,m.position.y,p.z);cardGrp.add(m)})}
function cardsUpdate(dt){if(!choosing)return;cardT-=dt;if(cardT>0)return;
 for(const h of hands){if(!h.s.visible||h.speed<1.2)continue;
  for(const p of bladePts(h.s))for(const m of cardGrp.children){const q=m.worldToLocal(p.clone());
   if(Math.abs(q.x)<.25&&Math.abs(q.y)<.31&&Math.abs(q.z)<.08){const it=m.userData.it;cardGrp.clear();choosing=false;buzz(h,1,100);snd(800,.2,'triangle',.2);cardCb(it);return}}}}
function pickBuffs(){return BUFFS.filter(b=>lv[b[2]]<10).sort(()=>Math.random()-.5).slice(0,3).map(b=>({t:b[0],d:[b[1],'Lv '+lv[b[2]]+' -> '+(lv[b[2]]+1)],k:b[2]}))}
function roundEnd(){meta.souls+=en.level*(en.boss?3:1);saveMeta();pl.hp=Math.min(pl.hpMax,pl.hp+15+bv('kh'));E.visible=false;
 const next=()=>{const it=pickBuffs();if(!it.length)return spawn(en.level+1);openCards(it,b=>{lv[b.k]++;if(b.k==='hp')pl.hp+=10;recalc();spawn(en.level+1)})};
 if(en.boss)openCards(WEAPONS.filter(w=>w!==wp).map(w=>({t:w.n,d:w.d,w})),c=>{wp=c.w;recalc();next()});else next()}
function gameOver(){lastRound=en.level;saveMeta();running=false;const s=renderer.xr.isPresenting&&renderer.xr.getSession();if(s)s.end();else showMenu()}
function startRun(){BUFFS.forEach(b=>lv[b[2]]=0);wp=WEAPONS[0];cardGrp.clear();choosing=false;rig.position.set(0,0,0);recalc();pl.hp=pl.hpMax;pl.st=pl.max;spawn(1);running=true;menu.style.display='none'}
const menu=document.createElement('div');menu.style.cssText='position:fixed;inset:0;z-index:10;background:rgba(10,12,18,.94);color:#eee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-family:system-ui,sans-serif;text-align:center;padding:16px';document.body.appendChild(menu);
const el=(tag,css,txt)=>{const e=document.createElement(tag);e.style.cssText=css;e.textContent=txt;return e};
const BS='padding:12px 22px;font-size:16px;border:0;border-radius:8px;background:#c9a227;color:#111;font-weight:700;cursor:pointer;min-width:280px';
function mbtn(t,fn,dis){const b=el('button',BS+(dis?';opacity:.4':''),t);b.onclick=fn;return b}
function showMenu(){running=false;choosing=false;cardGrp.clear();menu.style.display='flex';menu.textContent='';
 menu.appendChild(el('h1','margin:0;color:#c9a227;letter-spacing:4px','DUEL VR'));
 menu.appendChild(el('div','',(lastRound?'Last run: round '+lastRound+'  |  ':'')+'Souls: '+meta.souls));
 [['hp','Health +10'],['st','Stamina +1']].forEach(a=>{const k=a[0],c=3+meta[k]*3,mx=meta[k]>=10,no=mx||meta.souls<c;
  menu.appendChild(mbtn(a[1]+'  (Lv '+meta[k]+'/10)'+(mx?'  MAX':'  -  '+c+' souls'),()=>{if(!no){meta.souls-=c;meta[k]++;saveMeta();showMenu()}},no))});
 menu.appendChild(mbtn('PLAY (mouse)',startRun));menu.appendChild(btn);
 menu.appendChild(el('div','font-size:13px;color:#999;max-width:340px','Clear rounds to earn souls (permanent upgrades). After each round, slash 1 of 3 buffs. Every 5th round is a boss: pick a new weapon.'))}
renderer.xr.addEventListener('sessionstart',startRun);renderer.xr.addEventListener('sessionend',showMenu);

// ---------- input / desktop fallback ----------
let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=-(e.clientY/innerHeight*2-1)});
addEventListener('pointerdown',()=>{try{ac=ac||new AudioContext();ac.resume()}catch(e){}});
function stickMove(dt){
 for(const h of hands){if(h.hand!=='left'||!h.gp)continue;const ax=h.gp.axes[2]||0,ay=h.gp.axes[3]||0;
  if(Math.hypot(ax,ay)<.15)continue;camera.getWorldDirection(tmp);const f=new T.Vector2(tmp.x,tmp.z).normalize();
  rig.position.x+=(f.x*-ay-f.y*ax)*2*dt;rig.position.z+=(f.y*-ay+f.x*ax)*2*dt;
  const r=Math.hypot(rig.position.x,rig.position.z);if(r>5){rig.position.x*=5/r;rig.position.z*=5/r}}
}
const btn=document.getElementById('vr'),hint=document.getElementById('hint');
function desktop(){hint.textContent='Desktop mode: move the mouse to swing. Hit the glowing weak spots fast to deal damage. Put your sword in the way of red-glowing strikes to parry.'}
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
 if(!ok)return desktop();btn.style.display='';btn.textContent='ENTER VR';
 btn.onclick=async()=>{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});renderer.xr.setSession(s);btn.style.display='none';s.addEventListener('end',()=>{btn.style.display=''})};
 hint.textContent='Stick = move. Swing fast at the glowing weak spots. Block red-glowing strikes with your sword, or dodge.'}).catch(desktop)}else desktop();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

// ---------- loop ----------
spawn(1);showMenu();const clock=new T.Clock();
renderer.setAnimationLoop(()=>{
 const dt=Math.min(.05,clock.getDelta()||.016),time=clock.elapsedTime;
 if(!renderer.xr.isPresenting){const c=hands[0].c;
  c.visible=true;c.position.lerp(new T.Vector3(mx*.9,1.1+my*.6,-.6),.6);c.rotation.z=-mx*.9;c.rotation.x=0;c.updateMatrix();c.matrixWorldNeedsUpdate=true}
 stickMove(dt);
 scene.updateMatrixWorld(true);
 spots.forEach(s=>{const was=s.cool>0;s.cool=Math.max(0,s.cool-dt);s.life-=dt;if((was&&s.cool<=0)||s.life<=0){randSpot(s);s.life=6+bv('sl')+Math.random()*3}s.material.color.set(s.cool>0?0x444444:s.userData.head?0xff7a3d:0xffe14d);s.scale.setScalar(s.cool>0?.7:1+Math.sin(time*8)*.1)});
 if(running){updateEnemy(dt,time);playerAttacks(dt);cardsUpdate(dt)}
 vig.material.opacity=Math.max(0,vig.material.opacity-dt*1.2);msgT-=dt;
 if(running){pl.st=Math.min(pl.max,pl.st+dt*(.45+bv('sr'))*wp.reg);pl.hp=Math.min(pl.hpMax,pl.hp+bv('hpr')*dt)}hud();updateBars();renderer.render(scene,camera);
});
</script></body></html>
