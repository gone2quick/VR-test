<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hotroom VR</title>
<style>
:root{--bg:#f2f3f7;--fg:#14161c;--card:#fff;--ac:#e5322d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--fg:#eceef5;--card:#171a22;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0f14;--fg:#eceef5;--card:#171a22;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
#box{height:40vh;min-height:220px;border-radius:12px;overflow:hidden;background:#10131a}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:17px;margin:12px 0}
button:disabled{opacity:.6}
.c{background:var(--card);border-radius:12px;padding:12px 16px}
</style></head><body><main>
<h1>Hotroom VR</h1>
<div id="box"></div>
<button id="btn">Checking VR…</button> <span id="info"></span>
<div class="c"><b>Controls (Quest 3S)</b><br>Right trigger: shoot / stab · B: swap gun and knife · Left stick: move · Right stick: snap turn.<br>Time only moves as fast as you do. Hit the kill quota to clear the building and drop into a new one.</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,C=4,N=5,BG=0x10131a;
const scene=new T.Scene();scene.background=new T.Color(BG);scene.fog=new T.Fog(BG,4,22);
const cam=new T.PerspectiveCamera(70,1,.05,60);cam.position.set(0,1.6,0);
const rig=new T.Group();rig.add(cam);scene.add(rig);
scene.add(new T.HemisphereLight(0xffffff,0x445566,1.2));
const ren=new T.WebGLRenderer({antialias:true});ren.xr.enabled=true;
const box=document.getElementById('box'),info=document.getElementById('info'),btn=document.getElementById('btn');
box.appendChild(ren.domElement);
function fit(){ren.setSize(box.clientWidth,box.clientHeight);cam.aspect=box.clientWidth/box.clientHeight;cam.updateProjectionMatrix()}
addEventListener('resize',fit);fit();

const v=new T.Vector3(),w=new T.Vector3(),d=new T.Vector3(),d2=new T.Vector3(),pc=new T.Vector3(),tip=new T.Vector3(),q=new T.Quaternion(),ph=[new T.Vector3(),new T.Vector3()];
let bld=new T.Group(),walls=[],conn=[],dist=[],en=[],bl=[];
let level=0,score=0,hp=3,quota=4,kills=0,mode=0,ts=.1,cd=0,spT=5,pcell=-1,init=true,pend=false,flash=0,pb=false,sn=0,L=null,R=null;
const mat=c=>new T.MeshLambertMaterial({color:c});
const bx=(a,b,c,col,x,y,z)=>{const m=new T.Mesh(new T.BoxGeometry(a,b,c),mat(col));m.position.set(x,y,z);return m};
const wm=mat(0x8a93a8),fm=mat(0x2a2f3c);

// weapons
const wpn=new T.Group(),gun=new T.Group(),kn=new T.Group();
gun.add(bx(.04,.06,.2,0x333333,0,0,-.08),bx(.035,.09,.04,0x222222,0,-.06,0));
kn.add(bx(.03,.03,.1,0x553311,0,0,0),bx(.012,.05,.28,0xdddddd,0,0,-.19));
wpn.add(gun,kn);
// wrist HUD
const cv=document.createElement('canvas');cv.width=256;cv.height=128;
const cx=cv.getContext('2d'),tex=new T.CanvasTexture(cv);
const hud=new T.Mesh(new T.PlaneGeometry(.16,.08),new T.MeshBasicMaterial({map:tex}));
hud.position.set(0,.05,.04);hud.rotation.x=-.6;
function hudUp(){
  const s='SCORE '+score,t='BLDG '+(level+1)+'  KILLS '+kills+'/'+quota,u='HP '+'♥'.repeat(Math.max(hp,0))+'  '+(mode?'KNIFE':'GUN');
  cx.fillStyle='#000';cx.fillRect(0,0,256,128);cx.fillStyle='#fff';
  cx.font='bold 28px sans-serif';cx.fillText(s,10,36);
  cx.font='22px sans-serif';cx.fillText(t,10,72);cx.fillText(u,10,108);
  tex.needsUpdate=true;info.textContent=s+' · '+t+' · '+u;
}
function showW(){gun.visible=!mode;kn.visible=!!mode;hudUp()}

// controllers
const ctl=[0,1].map(i=>{
  const c=ren.xr.getController(i);rig.add(c);
  c.addEventListener('connected',e=>{
    c.userData.src=e.data;
    if(e.data.handedness==='right'){c.add(wpn);R=c}else{c.add(hud);L=c}
  });
  c.addEventListener('selectstart',()=>{if(c===R)trig()});
  return c;
});

// building generation
function wall(x,z,a,b){
  const m=new T.Mesh(new T.BoxGeometry(a,2.8,b),wm);m.position.set(x,1.4,z);bld.add(m);
  walls.push({x1:x-a/2,x2:x+a/2,z1:z-b/2,z2:z+b/2});
}
function seg(x,z,horiz,open){
  if(!open){horiz?wall(x,z,C,.2):wall(x,z,.2,C);return}
  const g=1.3,s=(C-g)/2,o=(g+s)/2;
  if(horiz){wall(x-o,z,s,.2);wall(x+o,z,s,.2)}else{wall(x,z-o,.2,s);wall(x,z+o,.2,s)}
}
function link(a,b){if(!conn[a].includes(b)){conn[a].push(b);conn[b].push(a)}}
const cellOf=(x,z)=>Math.min(N-1,Math.max(0,z/C|0))*N+Math.min(N-1,Math.max(0,x/C|0));
function bfs(s){
  dist=Array(N*N).fill(99);dist[s]=0;const qq=[s];
  while(qq.length){const c=qq.shift();conn[c].forEach(n=>{if(dist[n]>dist[c]+1){dist[n]=dist[c]+1;qq.push(n)}})}
}
function gen(){
  scene.remove(bld);bld=new T.Group();scene.add(bld);walls=[];
  en.forEach(e=>scene.remove(e.m));en=[];bl.forEach(s=>scene.remove(s.m));bl=[];
  const S=N*C;
  const f=new T.Mesh(new T.PlaneGeometry(S,S),fm);f.rotation.x=-Math.PI/2;f.position.set(S/2,0,S/2);bld.add(f);
  const cl=new T.Mesh(new T.PlaneGeometry(S,S),fm);cl.rotation.x=Math.PI/2;cl.position.set(S/2,2.8,S/2);bld.add(cl);
  conn=[...Array(N*N)].map(()=>[]);
  const seen=new Set([0]),st=[0];
  while(st.length){
    const c=st[st.length-1],x=c%N,y=c/N|0;
    const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[x+dx,y+dy]).filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!seen.has(b*N+a)).map(([a,b])=>b*N+a);
    if(!nb.length){st.pop();continue}
    const n=nb[Math.random()*nb.length|0];seen.add(n);st.push(n);link(c,n);
  }
  for(let i=0;i<N*N;i++){
    if(i%N<N-1&&Math.random()<.25)link(i,i+1);
    if(i+N<N*N&&Math.random()<.25)link(i,i+N);
  }
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x;
    if(x<N-1)seg((x+1)*C,y*C+C/2,false,conn[i].includes(i+1));
    if(y<N-1)seg(x*C+C/2,(y+1)*C,true,conn[i].includes(i+N));
  }
  wall(S/2,0,S,.2);wall(S/2,S,S,.2);wall(0,S/2,.2,S);wall(S,S/2,.2,S);
}
function mkEnemy(x,z){
  const g=new T.Group();g.add(bx(.45,1.3,.28,0xd8342e,0,.65,0));
  const h=new T.Mesh(new T.SphereGeometry(.14,12,8),mat(0xf0c8a0));h.position.y=1.5;g.add(h);
  g.position.set(x,0,z);scene.add(g);en.push({m:g,t:2+Math.random()*2});
}
function spawn(){
  const c=[];dist.forEach((x,i)=>{if(x>=2)c.push(i)});
  if(!c.length)return;
  const i=c[Math.random()*c.length|0];
  mkEnemy((i%N+.3+Math.random()*.4)*C,((i/N|0)+.3+Math.random()*.4)*C);
}
function newBld(){
  kills=0;quota=4+level*2;gen();
  rig.rotation.y=0;rig.position.set(C/2-cam.position.x,0,C/2-cam.position.z);
  pcell=0;bfs(0);for(let i=0;i<3;i++)spawn();spT=5;hudUp();
}

// combat
function trig(){
  if(mode||cd>0)return;cd=.25;
  R.getWorldPosition(w);R.getWorldQuaternion(q);d.set(0,0,-1).applyQuaternion(q);
  addBullet(w.clone().addScaledVector(d,.2),d.clone().multiplyScalar(18),0xffee55,.03,false);
}
function addBullet(p,vel,col,r,h){
  const m=new T.Mesh(new T.SphereGeometry(r,8,6),new T.MeshBasicMaterial({color:col}));
  m.position.copy(p);scene.add(m);bl.push({m,v:vel,t:3,h});
}
const hit=(e,p,r)=>Math.hypot(p.x-e.m.position.x,p.z-e.m.position.z)<r&&p.y>0&&p.y<1.9;
function kill(k){
  scene.remove(en[k].m);en.splice(k,1);kills++;score+=100;
  if(kills>=quota){score+=500;level++;pend=true}
  hudUp();
}
function hurt(){
  hp--;flash=.3;scene.background.set(0x601010);
  if(hp<=0){score=0;level=0;hp=3;pend=true}
  hudUp();
}
function push(){
  const r=.3;cam.getWorldPosition(v);
  for(const k of walls){
    if(v.x>k.x1-r&&v.x<k.x2+r&&v.z>k.z1-r&&v.z<k.z2+r){
      const a=[v.x-(k.x1-r),k.x2+r-v.x,v.z-(k.z1-r),k.z2+r-v.z],m=Math.min(...a),i=a.indexOf(m);
      if(i===0){rig.position.x-=m;v.x-=m}else if(i===1){rig.position.x+=m;v.x+=m}
      else if(i===2){rig.position.z-=m;v.z-=m}else{rig.position.z+=m;v.z+=m}
    }
  }
}

// main loop
const clock=new T.Clock();
ren.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  cam.getWorldPosition(v);
  const sp=init?0:Math.min(v.distanceTo(pc)/dt,4);pc.copy(v);
  const hv=ctl.map((c,i)=>{c.getWorldPosition(w);const s=init?0:Math.min(w.distanceTo(ph[i])/dt,8);ph[i].copy(w);return s});
  init=false;
  ts+=(Math.min(1,.05+sp*.5+(hv[0]+hv[1])*.12)-ts)*Math.min(1,dt*8);
  const wd=dt*ts;cd-=dt;
  if(flash>0){flash-=dt;if(flash<=0)scene.background.set(BG)}

  if(L&&L.userData.src.gamepad){
    const a=L.userData.src.gamepad.axes,x=a[2]||0,y=a[3]||0;
    if(Math.hypot(x,y)>.15){
      cam.getWorldDirection(d);d.y=0;d.normalize();
      rig.position.addScaledVector(d,-y*2*dt);
      d2.set(-d.z,0,d.x);rig.position.addScaledVector(d2,x*2*dt);
    }
  }
  if(R&&R.userData.src.gamepad){
    const g=R.userData.src.gamepad,x=g.axes[2]||0;
    if(Math.abs(x)>.7){if(!sn){rig.rotation.y-=Math.sign(x)*Math.PI/6;sn=1}}else sn=0;
    const bb=!!(g.buttons[5]&&g.buttons[5].pressed);
    if(bb&&!pb){mode^=1;showW()}pb=bb;
  }
  push();cam.getWorldPosition(v);
  const cell=cellOf(v.x,v.z);
  if(cell!==pcell){pcell=cell;bfs(cell)}

  // enemies
  for(const e of en){
    const p=e.m.position,ec=cellOf(p.x,p.z);let tx,tz;
    if(ec===cell){tx=v.x;tz=v.z}
    else{const n=conn[ec].reduce((a,c)=>dist[c]<dist[a]?c:a,conn[ec][0]);tx=(n%N+.5)*C;tz=((n/N|0)+.5)*C}
    d2.set(tx-p.x,0,tz-p.z);const ln=d2.length();
    if(ln>.01&&(ec!==cell||ln>1.2)){d2.normalize();p.addScaledVector(d2,1.3*wd)}
    e.m.rotation.y=Math.atan2(v.x-p.x,v.z-p.z);
    if(ec===cell){
      e.t-=wd;
      if(e.t<=0){
        e.t=2+Math.random()*2;
        w.set(p.x,1.4,p.z);d.copy(v).sub(w).normalize();
        addBullet(w.clone(),d.clone().multiplyScalar(5),0xff5522,.06,true);
      }
    }
  }
  // bullets
  for(let i=bl.length-1;i>=0;i--){
    const s=bl[i],p=s.m.position;
    p.addScaledVector(s.v,wd);s.t-=wd;
    let dead=s.t<=0||p.y<0||p.y>2.8||walls.some(k=>p.x>k.x1&&p.x<k.x2&&p.z>k.z1&&p.z<k.z2);
    if(!dead&&s.h){if(p.distanceTo(v)<.3){hurt();dead=true}}
    else if(!dead){const k=en.findIndex(e=>hit(e,p,.35));if(k>=0){kill(k);dead=true}}
    if(dead){scene.remove(s.m);bl.splice(i,1)}
    if(pend)break;
  }
  // knife
  const hr=R?hv[ctl.indexOf(R)]:0;
  if(mode&&R&&hr>1.2&&!pend){
    tip.set(0,0,-.33);R.localToWorld(tip);
    const k=en.findIndex(e=>hit(e,tip,.5));if(k>=0)kill(k);
  }
  // continual spawns
  spT-=wd;
  if(spT<=0){spT=Math.max(3,8-level);if(en.length<5+level)spawn()}
  if(pend){pend=false;newBld()}
  ren.render(scene,cam);
});
showW();newBld();

// enter VR
if(navigator.xr){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
    if(!ok){btn.textContent='VR not supported here';btn.disabled=true;return}
    btn.textContent='Enter VR';
    btn.onclick=async()=>{
      try{
        const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});
        ren.xr.setReferenceSpaceType('local-floor');await ren.xr.setSession(s);
      }catch(e){btn.textContent='Could not start VR'}
    };
  });
}else{btn.textContent='WebXR unavailable – open in Quest Browser';btn.disabled=true}
</script></body></html>
